[workspace]
members = ["crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["xiaomo"]
repository = "https://github.com/tytsxai/macfriends-cli"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dirs = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
